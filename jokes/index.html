const $=id=>document.getElementById(id);
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)}
function show(i){current=(i+jokes.length)%jokes.length;$('joke').textContent=jokes[current];$('counter').textContent='ШУТКА '+(current+1)+' / '+jokes.length;seen.add(current);$('seen').textContent=seen.size;$('favCount').textContent=favorites.length;$('favorite').textContent=favorites.includes(current)?'💔 Убрать из избранного':'❤️ В избранное'}
function next(){let n=current;while(n===current&&jokes.length>1)n=Math.floor(Math.random()*jokes.length);show(n)}
$('next').onclick=next;$('random').onclick=()=>show(Math.floor(Math.random()*jokes.length));
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(jokes[current]);toast('Скопировано. Теперь стыдно.')}catch(e){toast('Не удалось скопировать')}};
$('favorite').onclick=()=>{favorites=favorites.includes(current)?favorites.filter(x=>x!==current):[...favorites,current];localStorage.setItem('j67-favs',JSON.stringify(favorites));show(current);renderFav()};
$('toggleFav').onclick=()=>{$('favoriteList').classList.toggle('show');renderFav()};
function renderFav(){$('favoriteList').innerHTML='';favorites.forEach(i=>{let d=document.createElement('div');d.className='fav-item';let s=document.createElement('span');s.textContent=jokes[i];let b=document.createElement('button');b.textContent='Открыть';b.onclick=()=>show(i);d.append(s,b);$('favoriteList').append(d)})}
$('totalCount').textContent=jokes.length;show(0);renderFav();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
