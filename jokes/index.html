const baseCount=jokes.length, megaCount=300000;
const baseJokes=jokes;
jokes=new Proxy(baseJokes,{
 get(target,prop,receiver){
  if(prop==="length")return baseCount+megaCount;
  if(typeof prop==="string"&&/^(0|[1-9]\\d*)$/.test(prop)){
   const index=Number(prop);
   if(index>=baseCount&&index<baseCount+megaCount){
    const n=index-baseCount;
    const si=Math.floor(n/(megaActions.length*megaReasons.length));
    const ai=Math.floor(n/megaReasons.length)%megaActions.length;
    const ri=n%megaReasons.length;
    return `Почему ${megaSubjects[si]} ${megaActions[ai]}? Потому что ${megaReasons[ri]}.`;
   }
  }
  return Reflect.get(target,prop,receiver);
 }
});

   for(let i=0;i<jokes.length&&matches.length<30;i++)if(jokes[i].toLocaleLowerCase('ru').includes(q))matches.push(i);
   if(!matches.length){results.innerHTML='<div class="search-result">Ничего не нашлось. Даже шутки спрятались.</div>'}
   else matches.forEach(i=>{const b=document.createElement('button');b.className='search-result';b.textContent=(i+1)+'. '+jokes[i];b.onclick=()=>{window.show(i);results.classList.remove('show');input.blur()};results.append(b)});
   results.classList.add('show');
 }
 input.addEventListener('input',search);
 $('clearSearch').onclick=()=>{input.value='';search();input.focus()};
 document.addEventListener('keydown',e=>{
   if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
   if(e.code==='Space'){e.preventDefault();$('next').click()}
   if(e.key==='ArrowLeft')$('prev').click();
   if(e.key==='ArrowRight')$('next').click();
   if(e.key.toLowerCase()==='f')$('favorite').click();
 });
 $('progressFill').style.width=((current+1)/jokes.length*100)+'%';
})();
</script></body></html>
